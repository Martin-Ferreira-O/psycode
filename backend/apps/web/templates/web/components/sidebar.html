{% load static %}

<aside class="barra-lateral">
    <div class="marca-universidad">
        <img
            src="{% static 'web/img/logo.png' %}"
            alt="Universidad Autónoma de Chile"
            class="logo-universidad-sidebar"
        >
    </div>

    <nav class="navegacion" aria-label="Navegación principal">
        <a
            href="{% url 'web:dashboard' %}"
            class="enlace-menu{% if seccion_activa == 'dashboard' %} activo{% endif %}"
            {% if seccion_activa == "dashboard" %}aria-current="page"{% endif %}
        >
            Dashboard
        </a>

        <a
            href="{% url 'web:evaluaciones' %}"
            class="enlace-menu{% if seccion_activa == 'evaluaciones' %} activo{% endif %}"
            {% if seccion_activa == "evaluaciones" %}aria-current="page"{% endif %}
        >
            Registro de evaluaciones
        </a>

        <a
            href="{% url 'web:usuarios' %}"
            class="enlace-menu{% if seccion_activa == 'usuarios' %} activo{% endif %}"
            data-admin-only
            hidden
            {% if seccion_activa == "usuarios" %}aria-current="page"{% endif %}
        >
            Gestión de usuarios
        </a>

        <a href="{% url 'web:pcs' %}"
            class="enlace-menu{% if seccion_activa == 'pcs' %} activo{% endif %}"
            data-admin-only hidden
            {% if seccion_activa == "pcs" %}aria-current="page"{% endif %}>
            Gestión de PCs
        </a>

        <a
            href="{% url 'web:bitacora' %}"
            class="enlace-menu{% if seccion_activa == 'bitacora' %} activo{% endif %}"
            data-admin-only
            hidden
            {% if seccion_activa == "bitacora" %}aria-current="page"{% endif %}
        >
            Bitácora
        </a>

        <a
            href="{% url 'web:configuracion_operativa' %}"
            class="enlace-menu{% if seccion_activa == 'configuracion_operativa' %} activo{% endif %}"
            data-admin-only
            hidden
            {% if seccion_activa == "configuracion_operativa" %}aria-current="page"{% endif %}
        >
            Configuración operativa
        </a>
    </nav>

    <div class="espacio-lateral"></div>

    {% include "web/components/logout_button.html" %}
</aside>
