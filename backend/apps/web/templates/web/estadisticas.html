{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estadísticas de alertas</title>

    <link rel="stylesheet" href="{% static 'web/css/styles.css' %}">
</head>

<body>
    <main class="pagina">
        <a href="/dashboard" class="boton-regresar">
            ← Regresar al Dashboard
        </a>

        <header class="encabezado">
            <div>
                <span class="subtitulo">Resumen estadístico</span>
                <h1>Alertas registradas</h1>
            </div>

            <div class="selector-periodo">
                <button
                    type="button"
                    class="boton-periodo activo"
                    data-periodo="semana"
                >
                    Semana
                </button>

                <button
                    type="button"
                    class="boton-periodo"
                    data-periodo="mes"
                >
                    Mes
                </button>
            </div>
        </header>

        <section class="cuadricula">
            <article class="tarjeta tarjeta-grafico">
                <div class="tarjeta-encabezado">
                    <div>
                        <h2 id="tituloGrafico">Comportamiento semanal</h2>
                        <p>Cantidad de alertas registradas por período</p>
                    </div>

                    <span class="icono-grafico">▥</span>
                </div>

                <div
                    id="graficoBarras"
                    class="grafico-barras"
                    aria-label="Gráfico de cantidad de alertas"
                ></div>
            </article>

            <article class="tarjeta">
                <div class="tarjeta-encabezado">
                    <div>
                        <h2>Registro histórico</h2>
                        <p>Últimos movimientos del período seleccionado</p>
                    </div>
                </div>

                <button
                    type="button"
                    id="botonDescargar"
                    class="boton-descargar"
                >
                    ↓ Obtener registro de semana
                </button>

                <div id="registroHistorico" class="registro-historico"></div>
            </article>
        </section>
    </main>

    <script src="{% static 'web/js/estadisticas.js' %}"></script>
</body>
</html>
