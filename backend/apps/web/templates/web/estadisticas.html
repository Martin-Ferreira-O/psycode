{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estadísticas de alertas</title>

    <link rel="stylesheet" href="{% static 'web/css/styles.css' %}?v=4">
</head>

<body>
    <main class="pagina">
        <div class="barra-superior-estadisticas">
            <a
                href="/dashboard"
                class="boton-regresar"
                aria-label="Volver al dashboard"
                title="Volver al dashboard"
            >
                <svg
                    class="icono-regresar"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M15 18L9 12L15 6"></path>
                </svg>
            </a>

            <div class="selector-periodo">
                <button
                    type="button"
                    class="boton-periodo activo"
                    data-periodo="semana"
                >
                    Semana
                </button>

                <button
                    type="button"
                    class="boton-periodo"
                    data-periodo="mes"
                >
                    Mes
                </button>
            </div>
        </div>

        <header class="encabezado-estadisticas">
            <h1>Alertas registradas</h1>
        </header>

        <section class="cuadricula">
            <article class="tarjeta tarjeta-grafico">
                <div class="tarjeta-encabezado">
                    <h2 id="tituloGrafico">Comportamiento semanal</h2>
                </div>

                <div
                    id="graficoBarras"
                    class="grafico-barras"
                    aria-label="Gráfico de cantidad de alertas"
                ></div>
            </article>

            <article class="tarjeta tarjeta-registro">
                <div class="tarjeta-encabezado">
                    <h2>Registro histórico</h2>
                </div>

                <button
                    type="button"
                    id="botonDescargar"
                    class="boton-descargar"
                >
                    <svg
                        class="icono-descarga"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path d="M12 4V15"></path>
                        <path d="M7.5 10.5L12 15L16.5 10.5"></path>
                        <path d="M5 20H19"></path>
                    </svg>

                    <span id="textoDescarga">
                        Obtener registro de semana
                    </span>
                </button>

                <div
                    id="registroHistorico"
                    class="registro-historico"
                ></div>
            </article>
        </section>
    </main>

    <script src="{% static 'web/js/estadisticas.js' %}?v=4"></script>
</body>
</html>
