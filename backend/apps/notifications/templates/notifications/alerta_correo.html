<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ titulo }}</title>
  <style>
    .riesgo-bajo .indicador-riesgo { background-color: #16a34a; }
    .riesgo-medio .indicador-riesgo { background-color: #d97706; }
    .riesgo-alto .indicador-riesgo { background-color: #dc2626; }
    .riesgo-bajo .texto-riesgo { color: #16a34a; }
    .riesgo-medio .texto-riesgo { color: #d97706; }
    .riesgo-alto .texto-riesgo { color: #dc2626; }
  </style>
</head>
<body style="margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f1f5f9;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
    
    <!-- Encabezado Institucional -->
    <div style="background-color: #123962; color: #ffffff; padding: 12px 18px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
      <span>✉</span> Correo institucional
    </div>

    <!-- Contenido Principal Informativo (Sin Botones) -->
    <div style="padding: 24px 18px;">
      <table style="width: 100%; border-collapse: collapse;">
        <tr class="riesgo-{{ nivel_css }}">
          <td style="width: 52px; vertical-align: top; padding-right: 14px;">
            <div class="indicador-riesgo" style="width: 46px; height: 46px; border-radius: 50%; color: #ffffff; font-size: 26px; font-weight: 900; line-height: 46px; text-align: center;">!</div>
          </td>
          <td style="vertical-align: top;">
            <h2 style="margin: 0 0 10px 0; font-size: 17px; font-weight: 800; color: #0f172a; letter-spacing: 0.5px;">{{ titulo }}</h2>
            <div style="font-size: 14px; color: #1e293b; line-height: 1.6;">
              <div><strong>Box:</strong> {{ box }}</div>
              <div><strong>Tipo:</strong> {{ tipo_riesgo }}</div>
              <div><strong>Nivel:</strong> <span class="texto-riesgo" style="font-weight: 700;">{{ indicador_visual }}</span></div>
              {% if fecha %}
              <div><strong>Fecha:</strong> {{ fecha }}</div>
              {% endif %}
              <div><strong>Hora:</strong> {{ hora }}</div>
            </div>
            <p style="margin: 12px 0 0 0; font-size: 13px; color: #475569;">{{ mensaje }}</p>
          </td>
        </tr>
      </table>
    </div>

    <!-- Pie de Protección de Datos -->
    <div style="background-color: #f8fafc; padding: 10px 18px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b;">
      🛡 Sin datos personales del paciente
    </div>
  </div>
</body>
</html>
