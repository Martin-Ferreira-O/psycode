# Incluir dentro de http {}; completar certificados y nombres antes de desplegar.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
upstream psycode_asgi { server 127.0.0.1:8000; }
server {
    listen 443 ssl;
    server_name psycode.example.test;
    ssl_certificate /etc/ssl/psycode/fullchain.pem;
    ssl_certificate_key /etc/ssl/psycode/privkey.pem;
    client_max_body_size 26m;
    # Debe coincidir con STATIC_ROOT; nunca exponer .local/ completo.
    location /static/ {
        alias /opt/psycode/server/staticfiles/;
    }
    # Solo audio v2: cotas autenticadas por sesión en capture.
    location = /api/v2/internal/fragments {
        # Cubre la jornada clínica completa, incluido un día de 25 h por DST.
        client_max_body_size 3g;
        proxy_request_buffering off;
        proxy_pass http://psycode_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://psycode_asgi;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
