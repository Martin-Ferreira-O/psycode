map $http_upgrade $psycode_connection_upgrade { default upgrade; '' close; }

server {
    listen 80 default_server;
    server_name 144.22.56.52;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://144.22.56.52$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 144.22.56.52;
    ssl_certificate /etc/letsencrypt/live/psycode-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/psycode-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 26m;

    location /static/ {
        alias /srv/psycode/current/staticfiles/;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $psycode_connection_upgrade;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }
}
