name: Capture compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run python manage.py check --settings=backend.config.test_settings
      - run: uv run python manage.py migrate --settings=backend.config.test_settings --noinput
      - run: uv run python manage.py test backend.apps.capture backend.apps.operational --settings=backend.config.test_settings --noinput
