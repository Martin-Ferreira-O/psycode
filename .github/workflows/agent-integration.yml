name: Server and agent
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-integration.yml'
      - 'backend/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'tests/cross/**'
      - 'manage.py'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  contents: read
jobs:
  integration:
    if: github.event_name == 'workflow_dispatch' || vars.PSYCODE_AGENT_TESTS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check agent repository access
        env:
          AGENT_READ_TOKEN: ${{ secrets.PSYCODE_AGENT_READ_TOKEN }}
        run: |
          if [[ -z "$AGENT_READ_TOKEN" ]]; then
            echo "::error::Configure PSYCODE_AGENT_READ_TOKEN with read access to the agent repository."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check out agent
        uses: actions/checkout@v4
        with:
          repository: Martin-Ferreira-O/psycode-alterno
          ref: 582017c7cf52a349032134ba745d6626da28ef67
          token: ${{ secrets.PSYCODE_AGENT_READ_TOKEN }}
          persist-credentials: false
          path: .ci-agent
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-dev
      - name: Build agent wheel
        working-directory: .ci-agent
        run: uv build --wheel --out-dir "$RUNNER_TEMP/psycode-agent-wheel"
      - name: Test server and agent over HTTPS and WSS
        run: |
          wheels=("$RUNNER_TEMP"/psycode-agent-wheel/*.whl)
          uv run --no-sync python -m tests.cross.run --agent-wheel "${wheels[0]}"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Test PC registration and agent pairing in Chromium
        run: |
          wheels=("$RUNNER_TEMP"/psycode-agent-wheel/*.whl)
          uv venv "$RUNNER_TEMP/psycode-browser-agent"
          agent_python="$RUNNER_TEMP/psycode-browser-agent/bin/python"
          uv pip install --python "$agent_python" "${wheels[0]}"
          uv run --no-sync python -m tests.cross.run_pc_browser \
            --agent-python "$agent_python" \
            --playwright-module "$GITHUB_WORKSPACE/frontend/node_modules/playwright" \
            --artifacts-dir "$RUNNER_TEMP/psycode-pcs-browser"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pc-browser-evidence
          path: |
            ${{ runner.temp }}/psycode-pcs-browser/*.png
            ${{ runner.temp }}/psycode-pcs-browser/server.log
          if-no-files-found: ignore
