[project]
name = "psycode-api"
version = "0.1.0"
description = "Backend de gestión de alertas Psycode — SCRUM-31"
requires-python = ">=3.12,<3.14"
dependencies = [
    "Django>=5.2.18,<5.3",
    "djangorestframework>=3.16,<3.18",
    "djangorestframework-simplejwt>=5.5,<6",
    "django-cors-headers>=4.9,<5",
    "python-dotenv>=1.1,<2",
    "pymongo>=4.14,<5",
    "httpx>=0.28,<0.29",
    "openpyxl>=3.1.5,<4",
    "uvicorn>=0.38,<1",
    "websockets>=16,<17",
]

[tool.uv]
package = false

[dependency-groups]
test = [
    "tblib>=3,<4",
]
